<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1220"><meta name="color-scheme" content="dark">
<meta name="description" content="Clock：超大字倒數計時器與時鐘，支援自訂用途、時間及提前響鈴。">
<link rel="manifest" href="/manifest.webmanifest">
<title>Clock｜超大字倒數計時器</title>
<style>
:root{--bg:#0b1220;--panel:#162338;--line:#29364a;--text:#f7faff;--muted:#a1b4ca;--accent:#80f4d6;--alert:#ffd08a;--red:#ff8991;color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:default}
#app{max-width:1500px;min-height:100svh;margin:auto;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),14px) clamp(14px,3vw,36px) max(env(safe-area-inset-bottom),14px)}header{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:clamp(15px,1.5vw,19px);font-weight:900;letter-spacing:.36em;color:var(--accent)}.header-actions{display:flex;gap:7px}.icon-btn{color:var(--muted);border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:10px 13px;font-size:14px;font-weight:650}.mode-toggle{background:var(--panel);border-radius:18px;padding:5px;display:grid;grid-template-columns:1fr 1fr;align-self:center;width:min(100%,430px);margin:19px auto 0}.tab{border:0;background:transparent;border-radius:13px;color:var(--muted);font-size:17px;font-weight:750;padding:11px 20px}.tab.active{background:var(--accent);color:#091822}
.hero{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;min-height:200px;padding:15px 0 10px}.purpose{font-size:clamp(17px,2.7vw,34px);font-weight:780;color:var(--accent);margin-bottom:10px;text-align:center;line-height:1.35}.digits{font-variant-numeric:tabular-nums;letter-spacing:-.065em;font-weight:900;font-family:system-ui,-apple-system,"Arial Black",sans-serif;font-size:clamp(84px,21vw,290px);line-height:1.05;white-space:nowrap;max-width:100%;text-align:center}.digits.clock{font-size:clamp(48px,12.2vw,190px)}.digits.done{color:var(--alert)}.unit{margin-top:4px;color:var(--muted);font-size:clamp(12px,1.4vw,17px);letter-spacing:.12em}.track{width:min(100%,850px);height:8px;background:var(--line);border-radius:20px;margin-top:23px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:width .2s linear;border-radius:inherit}
.controls{display:flex;gap:13px;width:min(100%,740px);margin:0 auto 20px}.large-btn{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;padding:clamp(13px,2vw,20px);font-size:clamp(18px,2vw,23px);font-weight:850}.large-btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}.presets-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.presets-head strong{font-size:clamp(14px,1.7vw,20px)}.add{background:none;border:none;color:var(--accent);font-weight:750;font-size:16px;padding:9px}.presets{display:flex;gap:11px;overflow-x:auto;padding-bottom:5px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}.preset{flex:0 0 auto;min-width:135px;max-width:220px;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:15px;text-align:left;color:var(--text)}.preset.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.preset .name{font-weight:750;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preset.active .name{color:var(--accent)}.preset .duration{font-variant-numeric:tabular-nums;font-size:22px;font-weight:850;margin:6px 0}.preset .edit{color:var(--muted);font-size:12px;text-align:right;letter-spacing:.02em}.footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin:13px 0 0}.hint{text-align:center;margin:0 0 30px;color:var(--muted);font-size:17px}
.dialog-backdrop{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.dialog{background:var(--panel);padding:clamp(18px,3vw,28px);border-radius:23px;width:min(100%,500px);box-shadow:0 24px 80px #0008;max-height:90svh;overflow:auto}.dialog h2{margin:0 0 15px;font-size:25px}.label{display:block;color:var(--muted);font-size:14px;font-weight:650;margin:14px 0 8px}.textinput{width:100%;font-size:22px;padding:12px 15px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px}.time-fields{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px}.modal-actions{display:flex;gap:12px;margin-top:20px}.modal-actions .large-btn{font-size:17px;padding:13px 10px}.note{font-size:13px;line-height:1.6;color:var(--muted)}.danger{color:var(--red);border:0;background:none;margin:20px auto 0;display:block}.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}.switch button{background:var(--bg);color:var(--accent);border:1px solid var(--line);padding:10px 14px;border-radius:12px}.identity{background:#0b1220;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:13px;color:var(--muted);margin-top:18px}.identity a{color:var(--accent)}.hidden{display:none!important}
body.fullscreen #app{max-width:none}body.theater header,body.theater .mode-toggle,body.theater .controls,body.theater .presets-head,body.theater .presets,body.theater .footer{display:none!important}body.theater #app{padding:10px}body.theater .hero{height:90svh}#exitTheater{display:none;position:fixed;z-index:30;right:16px;top:16px;background:#162338;color:#80f4d6;border:1px solid #80f4d6;border-radius:12px;padding:12px 18px;font-weight:800}body.theater #exitTheater{display:block}
@media (min-width:1100px){.digits{font-size:min(23vw,34vh,345px)}.digits.clock{font-size:min(13vw,25vh,230px)}}
@media (max-height:500px) and (orientation:landscape){#app{padding:7px 18px}.mode-toggle{margin:4px auto}.hero{min-height:100px;padding:0}.digits{font-size:min(21vw,34vh,210px)}.digits.clock{font-size:min(14vw,32vh,170px)}.purpose{margin:3px;font-size:18px}.unit{margin:0}.track{margin-top:7px;height:5px}.controls{margin-bottom:7px}.large-btn{padding:7px}.presets{padding-bottom:0}.preset{padding:7px 11px}.preset .duration{font-size:17px;margin:0}.footer{margin-top:4px}}
@media (prefers-reduced-motion: reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app">
<header><div class="brand">CLOCK</div><div class="header-actions"><button id="sound" class="icon-btn" title="切換響鈴">聲音：開</button><button id="full" class="icon-btn">⛶ 全螢幕</button><button id="settings" class="icon-btn">⚙ 設定</button></div></header>
<div class="mode-toggle" role="tablist" aria-label="顯示模式"><button id="timerTab" class="tab active" role="tab" aria-selected="true">倒數計時</button><button id="clockTab" class="tab" role="tab" aria-selected="false">時鐘</button></div>
<section class="hero" aria-live="off"><div class="purpose" id="purpose">休息時間</div><div id="digits" class="digits" role="timer" aria-label="剩餘時間">05:00</div><div class="unit" id="unit">分 : 秒</div><div class="track" id="track"><div id="fill" class="fill"></div></div></section>
<div id="timerPanel"><div class="controls"><button id="start" class="large-btn primary">開始</button><button id="reset" class="large-btn">重設</button></div><div class="presets-head"><strong>快速切換用途</strong><button id="add" class="add">＋ 新增用途</button></div><div id="presets" class="presets" aria-label="預設用途清單"></div></div>
<p id="clockHint" class="hint hidden">超大時鐘 · 顯示時分秒</p>
<div class="footer"><span id="summary">結束前 10 秒提醒 · 響鈴開啟 · 可離線使用</span><div id="notice" style="font-size:11px;margin-top:4px">開啟畫面時可準時提醒；鎖屏、背景分頁或系統省電可能延遲鈴聲</div></div>
</main>
<button id="exitTheater" aria-label="離開全螢幕" type="button">離開全螢幕</button>
<div class="dialog-backdrop hidden" id="overlay" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
<h2 id="dialogTitle">新增用途</h2><div id="presetForm"><label class="label" for="presetName">用途名稱</label><input class="textinput" id="presetName" maxlength="24" placeholder="例如：休息時間"><span class="label">倒數時間</span><div class="time-fields"><input id="minutes" class="textinput" type="number" min="0" max="1439" inputmode="numeric" value="5" aria-label="分鐘"><span>分</span><input id="seconds" class="textinput" type="number" min="0" max="59" inputmode="numeric" value="0" aria-label="秒"><span>秒</span></div><p class="note">每一種用途可設定固定倒數長度，選取後即可開始。</p></div>
<div id="settingsForm" class="hidden"><label class="label" for="lead">結束前幾秒響鈴（0～120）</label><input id="lead" class="textinput" inputmode="numeric" type="number" min="0" max="120" value="10"><p class="note">提前提醒只響一次；歸零時會再響鈴。設定 0 代表只在歸零響鈴。</p><div class="switch"><span>提示音效</span><button id="soundToggle">開啟</button></div><div class="identity"><strong>Starry ID 中央會員</strong><p id="memberStatus">正在檢查只讀 API…</p><a href="https://id.starry.phd/account" target="_blank" rel="noopener noreferrer">開啟中央會員帳號中心</a><p>Clock 的 OAuth 登入須先完成中央 App Registry 登記，不會修改中央會員程式碼；計時器可免登入使用。</p></div></div>
<p id="formError" class="note" style="color:var(--red)" role="alert"></p><div class="modal-actions"><button id="cancel" class="large-btn">取消</button><button id="save" class="large-btn primary">儲存</button></div><button id="delete" class="danger hidden">刪除此用途</button>
</div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const initial=[{id:'break',name:'休息時間',durationSeconds:300},{id:'opening',name:'開場致詞',durationSeconds:180},{id:'speech',name:'主題分享',durationSeconds:1200}];
const key='clock:preferences:v1';let presets=initial.map(x=>({...x}));let selected='break';let lead=10,muted=false,mode='timer',status='idle',durationMs=300000,remainMs=300000,deadline=null,warned=false,completed=false,editor=null,dialog=null,ctx=null,wakeLock=null,theater=false;
function num(n,min,max){n=Number(n);return Number.isInteger(n)&&n>=min&&n<=max?n:null}
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function read(){try{const raw=JSON.parse(localStorage.getItem(key)||'null');if(!raw||typeof raw!=='object')return;
const p=Array.isArray(raw.presets)?raw.presets.filter(v=>v&&typeof v.id==='string'&&typeof v.name==='string'&&v.name.trim().length>0&&v.name.length<=24&&num(v.durationSeconds,1,86400)!==null).slice(0,50):[];if(p.length)presets=p;
if(presets.some(p=>p.id===raw.selectedId))selected=raw.selectedId;if(num(raw.alertSeconds,0,120)!==null)lead=raw.alertSeconds;muted=raw.muted===true;
}catch{}}
function persist(){try{localStorage.setItem(key,JSON.stringify({presets,selectedId:selected,alertSeconds:lead,muted}))}catch{}}
function current(){return presets.find(x=>x.id===selected)||presets[0]}
function reset(){durationMs=current().durationSeconds*1000;remainMs=durationMs;deadline=null;status='idle';warned=false;completed=false;update()}
function choose(id){if(!presets.some(p=>p.id===id))return;selected=id;reset();persist();renderPresets()}
function durationLabel(ms){return fmt(ms/1000)}
function update(){const d=new Date();if(mode==='clock'){$('digits').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');$('purpose').textContent='現在時間';$('unit').textContent='時 : 分 : 秒';return}
$('digits').textContent=durationLabel(remainMs);$('digits').classList.toggle('done',status==='done');$('purpose').textContent=current().name;$('start').textContent=status==='running'?'暫停':status==='paused'?'繼續':'開始';$('unit').textContent=status==='done'?'時間到':status==='running'?'倒數進行中':'分 : 秒';$('fill').style.width=(100*Math.max(0,Math.min(1,1-remainMs/durationMs)))+'%';}
function drawMode(){const timer=mode==='timer';$('timerTab').classList.toggle('active',timer);$('clockTab').classList.toggle('active',!timer);$('timerTab').setAttribute('aria-selected',String(timer));$('clockTab').setAttribute('aria-selected',String(!timer));$('timerPanel').classList.toggle('hidden',!timer);$('track').classList.toggle('hidden',!timer);$('clockHint').classList.toggle('hidden',timer);$('digits').classList.toggle('clock',!timer);$('digits').classList.remove('done');update()}
function renderPresets(){const wrap=$('presets');wrap.replaceChildren();for(const p of presets){const b=document.createElement('button');b.className='preset'+(selected===p.id?' active':'');b.setAttribute('aria-label',p.name+'，'+fmt(p.durationSeconds)+'，點擊選取');const n=document.createElement('div');n.className='name';n.textContent=p.name;const d=document.createElement('div');d.className='duration';d.textContent=fmt(p.durationSeconds);const edit=document.createElement('div');edit.className='edit';edit.textContent='編輯 ↗';b.append(n,d,edit);b.addEventListener('click',e=>{if(e.target instanceof Element&&e.target.closest('.edit')){showPreset(p.id)}else{choose(p.id)}});wrap.appendChild(b)}}
function summary(){$('summary').textContent=(lead===0?'只在歸零響鈴':`結束前 ${lead} 秒提醒`)+' · '+(muted?'靜音':'響鈴開啟')+' · 可離線使用';$('sound').textContent=muted?'聲音：關':'聲音：開';$('soundToggle').textContent=muted?'已靜音':'已開啟'}
function unlockAudio(){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!ctx)ctx=new Audio();if(ctx.state==='suspended')ctx.resume().catch(()=>{})}catch{}}
function sound(final=false){if(muted)return;unlockAudio();if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime;const melody=final?[660,880,1100]:[990];melody.forEach((frequency,i)=>{try{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=frequency;gain.gain.setValueAtTime(.0001,t+i*.16);gain.gain.exponentialRampToValueAtTime(.17,t+i*.16+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+i*.16+.22);osc.connect(gain);gain.connect(ctx.destination);osc.start(t+i*.16);osc.stop(t+i*.16+.24)}catch{}})}
async function keepAwake(){try{if('wakeLock' in navigator&&status==='running'&&document.visibilityState==='visible'&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch{}}
function start(){unlockAudio();if(status==='running'){remainMs=Math.max(0,deadline-Date.now());deadline=null;status='paused'}else{if(status==='done'){reset()}deadline=Date.now()+remainMs;status='running';keepAwake()}update()}
function tick(){if(status==='running'&&deadline!==null){const old=remainMs;remainMs=Math.max(0,deadline-Date.now());if(!warned&&lead>0&&remainMs>0&&remainMs<=lead*1000){warned=true;sound(false)}if(remainMs===0&&!completed){completed=true;status='done';deadline=null;sound(true)}if(Math.ceil(old/1000)!==Math.ceil(remainMs/1000)||status==='done')update()}if(mode==='clock')update()}
function closeDialog(){dialog=null;$('overlay').classList.add('hidden');$('formError').textContent=''}
function openDialog(type){dialog=type;$('overlay').classList.remove('hidden');$('presetForm').classList.toggle('hidden',type!=='preset');$('settingsForm').classList.toggle('hidden',type!=='settings');$('delete').classList.toggle('hidden',type!=='preset'||!editor||presets.length<2);$('dialogTitle').textContent=type==='settings'?'計時器設定':editor?'編輯用途':'新增用途';$('formError').textContent='';$('save').textContent=type==='settings'?'套用':'儲存';if(type==='settings'){$('lead').value=String(lead);checkMember()}else{$('presetName').value=editor?.name||'';$('minutes').value=String(editor?Math.floor(editor.durationSeconds/60):5);$('seconds').value=String(editor?editor.durationSeconds%60:0)}setTimeout(()=>$(type==='settings'?'lead':'presetName').focus(),60)}
function showPreset(id){editor=presets.find(p=>p.id===id)||null;openDialog('preset')}
function save(){if(dialog==='settings'){const n=num($('lead').value,0,120);if(n===null){$('formError').textContent='請輸入 0～120 秒';return}lead=n;summary();persist();closeDialog();return}
if(dialog==='preset'){const name=$('presetName').value.trim(),m=num($('minutes').value,0,1439),s=num($('seconds').value,0,59);if(!name||name.length>24||m===null||s===null||(m===0&&s===0)){$('formError').textContent='名稱 1～24 字；時間需介於 00:01 與 1439:59。';return}
const p={id:editor?.id||'p'+Date.now()+'-'+Math.random().toString(36).slice(2,6),name,durationSeconds:m*60+s};if(!editor&&presets.length>=50){$('formError').textContent='最多儲存 50 組用途';return}presets=editor?presets.map(x=>x.id===editor.id?p:x):[...presets,p];choose(p.id);closeDialog()}}
function full(){if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{});document.body.classList.remove('fullscreen');return}if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().then(()=>document.body.classList.add('fullscreen')).catch(()=>{theater=!theater;document.body.classList.toggle('theater',theater)})}else{theater=!theater;document.body.classList.toggle('theater',theater)} }
async function checkMember(){const status=$('memberStatus');status.textContent='正在檢查 Clock App 登記…';try{const res=await fetch('/api/starry/status',{cache:'no-store'});const data=await res.json();status.textContent=data.app==='active'?'中央會員 App 已登記（尚需完成登入驗證）':data.app==='pending'?'尚未登記 clock；計時功能可正常使用':'中央會員暫時無法驗證；計時功能正常'}catch{status.textContent='會員 API 未連線；計時功能正常'}}
$('start').addEventListener('click',start);$('reset').addEventListener('click',reset);$('timerTab').addEventListener('click',()=>{mode='timer';drawMode()});$('clockTab').addEventListener('click',()=>{mode='clock';drawMode()});$('sound').addEventListener('click',()=>{muted=!muted;unlockAudio();summary();persist()});$('soundToggle').addEventListener('click',()=>{muted=!muted;summary();persist()});$('add').addEventListener('click',()=>{editor=null;openDialog('preset')});$('settings').addEventListener('click',()=>openDialog('settings'));$('full').addEventListener('click',full);$('exitTheater').addEventListener('click',()=>{theater=false;document.body.classList.remove('theater')});$('cancel').addEventListener('click',closeDialog);$('save').addEventListener('click',save);$('delete').addEventListener('click',()=>{if(!editor||presets.length<=1)return;presets=presets.filter(p=>p.id!==editor.id);if(selected===editor.id)selected=presets[0].id;reset();persist();renderPresets();closeDialog()});$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();if(e.code==='Space'&&!dialog&&mode==='timer'&&e.target===document.body){e.preventDefault();start()}});document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fullscreen',Boolean(document.fullscreenElement)));document.addEventListener('visibilitychange',()=>{tick();if(document.visibilityState==='visible')keepAwake()});
read();reset();renderPresets();summary();setInterval(tick,100);drawMode();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script>
</body></html>
