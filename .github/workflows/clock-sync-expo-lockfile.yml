name: clock-sync-expo-lockfile
on:
  push:
    branches:
      - chore/expo-release-deps
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'
      - name: Regenerate dependency lockfile for native EAS
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Push lockfile only to this feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(clock): refresh Expo SDK 58 dependency lockfile'
            git push origin HEAD:chore/expo-release-deps
          fi
