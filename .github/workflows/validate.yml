name: clock-validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clock-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI image: no third-party hosted scanning account or license required.
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --no-banner --redact --config=/github/workspace/.gitleaks.toml /github/workspace
  verify:
    name: Tests and TS types
    needs: gitleaks
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-transform-types
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen:starry
      - run: node --test packages/clock-core/test/clock.test.mjs
      - run: python3 tools/build_worker.py
      # One-time public/static web artifact transport for Cloudflare release.
      # Never print tokens, env vars, or Worker secrets; remove before merge.
      - name: Temporary verified public Web Worker transfer (remove before merging)
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,gzip
          from pathlib import Path
          worker=Path('web-preview/cloudflare-worker.mjs').read_bytes()
          print('CLOCK_RELEASE_WORKER_SHA256='+hashlib.sha256(worker).hexdigest())
          print('CLOCK_RELEASE_WORKER_GZIP_B64='+base64.b64encode(gzip.compress(worker,mtime=0)).decode('ascii'))
          PY

      - name: Retain verified Web deployment bundle for staged rollout
        uses: actions/upload-artifact@v4
        with:
          name: clock-web-worker-${{ github.sha }}
          path: web-preview/cloudflare-worker.mjs
          if-no-files-found: error
          retention-days: 3
      - run: node --test test/worker-smoke.mjs
      - run: node --test test/starry-relay.test.mjs
      - run: node --test test/clock-api.test.mjs
      - run: node --test test/platform-parity.test.mjs
      - run: node --test test/clock-member-v18.test.mjs
      - run: node --test test/clock-member-v20261108.test.mjs
      - run: node --test test/clock-passkey-parity.test.mjs
      - run: node --test test/clock-web-sso.test.mjs
      - run: node --test test/clock-battery-feature.test.mjs
      - run: node --test test/clock-free-sync.test.mjs
      - run: node --test test/clock-api-staging.test.mjs
      - run: python3 -m unittest tools/test_extract_android_sha256.py
      - run: python3 tools/check_platform_parity.py
      - run: python3 tools/preflight.py --checks static
      - run: pnpm --dir apps/clock exec tsc --noEmit
  registry:
    name: Starry ID clock registration
    runs-on: ubuntu-latest
    steps:
      - name: GET registered public app config (no member secrets)
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors --max-time 20 -fsS \
            'https://id.starry.phd/v1/apps/clock/config' > /tmp/clock-config.json
          python3 - <<'PY'
          import json
          with open('/tmp/clock-config.json') as fh:
              config=json.load(fh)
          assert config['app_id']=='clock', 'wrong app_id'
          assert config['status']=='active', 'clock is not active'
          print('clock config: active; min_version:',config['min_version'])
          PY
