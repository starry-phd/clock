name: clock-validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clock-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI image: no third-party hosted scanning account or license required.
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --no-banner --redact --config=/github/workspace/.gitleaks.toml /github/workspace
  verify:
    name: Tests and TS types
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen:starry
      - run: node --test packages/clock-core/test/clock.test.mjs
      - run: python3 tools/build_worker.py
      - run: node --test test/worker-smoke.mjs
      - run: node --test test/starry-relay.test.mjs
      - run: node --test test/clock-api.test.mjs
      - run: node --test test/platform-parity.test.mjs
      - run: node --test test/clock-battery-feature.test.mjs
      - run: node --test test/clock-api-staging.test.mjs
      - run: python3 tools/check_platform_parity.py
      - run: python3 tools/preflight.py --checks static
      - run: pnpm --dir apps/clock exec tsc --noEmit
  registry:
    name: Starry ID clock registration
    runs-on: ubuntu-latest
    steps:
      - name: GET registered public app config (no member secrets)
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors --max-time 20 -fsS \
            'https://id.starry.phd/v1/apps/clock/config' > /tmp/clock-config.json
          python3 - <<'PY'
          import json
          with open('/tmp/clock-config.json') as fh:
              config=json.load(fh)
          assert config['app_id']=='clock', 'wrong app_id'
          assert config['status']=='active', 'clock is not active'
          print('clock config: active; min_version:',config['min_version'])
          PY
