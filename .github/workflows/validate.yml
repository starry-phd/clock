name: clock-validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clock-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'
      - run: pnpm install --frozen-lockfile=false
      - run: node --test packages/clock-core/test/clock.test.mjs
      - run: node --test test/worker-smoke.mjs
      - run: python3 tools/preflight.py --checks static
      - run: pnpm --dir apps/clock exec tsc --noEmit
